name: NurPismo
options:
  minimumXcodeGenVersion: 2.45.4
  xcodeVersion: "15.3"
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: "16.0"

fileGroups:
  - StoreKit/GlowLetter.storekit

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: 2.4.1
    CURRENT_PROJECT_VERSION: 16

targets:
  NurPismo:
    type: application
    platform: iOS
    sources:
      - path: NurPismo
        excludes:
          - Assets.xcassets
          - Info.plist
          - PrivacyInfo.xcprivacy
          - WebResources
      - path: NurPismo/Assets.xcassets
        buildPhase: resources
      - path: NurPismo/WebResources
        type: folder
        buildPhase: resources
      - path: NurPismo/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: StoreKit/GlowLetter.storekit
        buildPhase: resources
    preBuildScripts:
      - name: Sync current web application
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          /usr/bin/python3 "$SRCROOT/../scripts/sync_web_assets.py" \
            --source "$SRCROOT/../.." \
            --destination "$SRCROOT/NurPismo/WebResources"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.franceisl.glowletternext
        PRODUCT_NAME: GlowLetter
        PRODUCT_MODULE_NAME: NurPismo
        INFOPLIST_FILE: NurPismo/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO

  NurPismoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NurPismoTests
    dependencies:
      - target: NurPismo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.franceisl.glowletternext.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GlowLetter.app/GlowLetter"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  NurPismo:
    build:
      targets:
        NurPismo: all
        NurPismoTests: [test]
    run:
      config: Debug
      storeKitConfiguration: StoreKit/GlowLetter.storekit
    test:
      config: Debug
      targets:
        - NurPismoTests
    archive:
      config: Release

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbeee4"/><stop offset=".55" stop-color="#f6e1d3"/><stop offset="1" stop-color="#efd3c3"/></linearGradient>
    <radialGradient id="window" cx=".72" cy=".08" r=".7"><stop offset="0" stop-color="#fffaf2" stop-opacity="1"/><stop offset=".5" stop-color="#fff4e6" stop-opacity=".55"/><stop offset="1" stop-color="#fff4e6" stop-opacity="0"/></radialGradient>
    <radialGradient id="heartGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff6d8f" stop-opacity=".95"/><stop offset=".45" stop-color="#ff8fa8" stop-opacity=".45"/><stop offset="1" stop-color="#ffb3c3" stop-opacity="0"/></radialGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8aa5"/><stop offset="1" stop-color="#e0345f"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".3" stop-color="#fff" stop-opacity=".08"/><stop offset=".8" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".45"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d08a"/><stop offset="1" stop-color="#b98238"/></linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4dcd6"/><stop offset="1" stop-color="#e6c2bb"/></linearGradient>
    <filter id="blur8" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur4" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="400" height="640" fill="url(#wall)"/>
  <rect width="400" height="640" fill="url(#window)"/>
  <!-- шторы -->
  <g filter="url(#blur8)" opacity=".75">
    <path d="M0 0h70c-6 120 8 260-4 420H0Z" fill="#f7e6dd"/>
    <path d="M18 0c-4 140 6 280 0 420" stroke="#ecd2c6" stroke-width="10" fill="none"/>
    <path d="M46 0c-6 150 8 290 0 430" stroke="#f1dbd0" stroke-width="8" fill="none"/>
    <path d="M330 0h70v360c-30-90-50-220-70-360Z" fill="#fbefe7"/>
  </g>
  <!-- плавающее сердечко -->
  <path d="M120 120c-12-14-34-4-30 14 3 12 18 22 30 30 12-8 27-18 30-30 4-18-18-28-30-14Z" fill="#f7a9bb" opacity=".5" filter="url(#blur4)"/>
  <!-- растение -->
  <g filter="url(#blur8)" opacity=".85">
    <ellipse cx="30" cy="250" rx="34" ry="14" transform="rotate(-30 30 250)" fill="#5d7a4a"/>
    <ellipse cx="66" cy="214" rx="30" ry="12" transform="rotate(-60 66 214)" fill="#6f8b55"/>
    <ellipse cx="18" cy="300" rx="36" ry="13" transform="rotate(20 18 300)" fill="#4f6c3f"/>
    <ellipse cx="96" cy="262" rx="32" ry="12" transform="rotate(-15 96 262)" fill="#68844f"/>
    <ellipse cx="40" cy="190" rx="26" ry="10" transform="rotate(-80 40 190)" fill="#7a955e"/>
    <ellipse cx="118" cy="226" rx="24" ry="9" transform="rotate(-40 118 226)" fill="#5f7c4b"/>
    <ellipse cx="60" cy="330" rx="30" ry="11" transform="rotate(35 60 330)" fill="#56723f"/>
  </g>
  <!-- столик со скатертью -->
  <g filter="url(#blur2)">
    <path d="M-10 470h250c10 0 16 8 14 18l-12 120H-10Z" fill="url(#cloth)"/>
    <path d="M-10 470h250c8 0 14 4 14 10H-10Z" fill="#f9e9e4"/>
  </g>
  <!-- свечение сердца -->
  <circle cx="125" cy="400" r="120" fill="url(#heartGlow)" filter="url(#soft)" opacity=".85"/>
  <!-- подставка купола -->
  <ellipse cx="125" cy="478" rx="78" ry="14" fill="url(#gold)"/>
  <rect x="50" y="462" width="150" height="16" rx="6" fill="url(#gold)"/>
  <ellipse cx="125" cy="462" rx="74" ry="9" fill="#f6dba0"/>
  <!-- стеклянный купол -->
  <path d="M60 462V350a65 65 0 0 1 130 0v112Z" fill="url(#glass)" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
  <path d="M74 452V352a50 50 0 0 1 22-42" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".55" filter="url(#blur2)"/>
  <!-- сердце -->
  <path d="M125 450c-26-20-50-36-50-60 0-16 12-28 27-28 10 0 18 6 23 14 5-8 13-14 23-14 15 0 27 12 27 28 0 24-24 40-50 60Z" fill="url(#heart)"/>
  <path d="M93 382c3-7 9-11 16-11" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".65"/>
  <path d="M125 450v12" stroke="#d9a35b" stroke-width="3"/>
  <!-- огоньки внутри купола -->
  <g fill="#fff3d6">
    <circle cx="84" cy="420" r="1.8"/><circle cx="168" cy="414" r="1.6"/><circle cx="102" cy="352" r="1.4"/><circle cx="152" cy="346" r="1.8"/>
    <circle cx="176" cy="380" r="1.3"/><circle cx="76" cy="384" r="1.5"/><circle cx="140" cy="440" r="1.4"/><circle cx="110" cy="440" r="1.2"/>
  </g>
  <g fill="#fff" opacity=".9" filter="url(#blur2)">
    <circle cx="84" cy="420" r="3.4"/><circle cx="168" cy="414" r="3"/><circle cx="152" cy="346" r="3.2"/>
  </g>
  <!-- свечи справа, размыты -->
  <g filter="url(#blur8)">
    <rect x="262" y="410" width="26" height="70" rx="6" fill="#fbf1e6"/>
    <rect x="300" y="430" width="22" height="50" rx="6" fill="#f8ebdf"/>
    <circle cx="275" cy="398" r="14" fill="#ffd79a" opacity=".9"/>
    <circle cx="311" cy="420" r="11" fill="#ffd79a" opacity=".8"/>
  </g>
  <!-- блики-боке -->
  <g filter="url(#blur4)" opacity=".7">
    <circle cx="220" cy="300" r="7" fill="#fff6e8"/>
    <circle cx="250" cy="560" r="9" fill="#ffe6d6"/>
    <circle cx="190" cy="200" r="5" fill="#fff"/>
    <circle cx="350" cy="250" r="8" fill="#fff4ea"/>
  </g>
  <!-- золотые искры -->
  <g fill="#f2cc74">
    <path d="M206 520l2 6 6 2-6 2-2 6-2-6-6-2 6-2Z"/>
    <path d="M30 520l1.5 4.5 4.5 1.5-4.5 1.5L30 532l-1.5-4.5L24 526l4.5-1.5Z" opacity=".8"/>
    <path d="M370 30l1.5 4.5 4.5 1.5-4.5 1.5L370 42l-1.5-4.5L364 36l4.5-1.5Z"/>
  </g>
</svg>

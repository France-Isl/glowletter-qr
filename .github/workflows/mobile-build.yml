name: GlowLetter Mobile Preview

on:
  workflow_dispatch:
    inputs:
      verification_url:
        description: "Optional HTTPS purchase-verification backend URL"
        required: false
        type: string
      cloud_project_number:
        description: "Optional Play Integrity Google Cloud project number"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: mobile-preview-release
  cancel-in-progress: false

jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Generate launcher and store artwork
        run: python mobile/scripts/generate_store_assets.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36.1
        run: sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.1.0"

      - name: Set up Gradle 9.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Test billing and build fail-closed debug APK plus unsigned release AAB
        working-directory: mobile/android
        env:
          NURPISMO_VERIFICATION_URL: ${{ inputs.verification_url }}
          NURPISMO_CLOUD_PROJECT_NUMBER: ${{ inputs.cloud_project_number }}
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleRelease

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/dist
          cp mobile/android/app/build/outputs/apk/debug/GlowLetter-2.2.6-debug.apk \
            mobile/dist/GlowLetter-2.2.6-preview-debug.apk
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab \
            mobile/dist/GlowLetter-2.2.6-preview-unsigned.aab
          cp mobile/store-assets/nurpismo-play-icon-512.png \
            mobile/dist/GlowLetter-play-icon-512.png
          cp mobile/store-assets/nurpismo-feature-1024x500.png \
            mobile/dist/GlowLetter-feature-1024x500.png

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: glowletter-v2.2.6-preview
          path: mobile/dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Create or update preview prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v2.2.6-preview
        shell: bash
        run: |
          set -euo pipefail
          NOTES='Preview only. Both public artifacts fail closed: they do not contain owner access or a mock entitlement. The unsigned AAB targets the monthly GlowLetter Premium subscription and cannot be submitted to production until Play App Signing/upload-key, the purchase-verification backend, Play Console subscription and RTDN are configured.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "GlowLetter 2.2.6 preview" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "GlowLetter 2.2.6 preview" --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" mobile/dist/* --clobber
